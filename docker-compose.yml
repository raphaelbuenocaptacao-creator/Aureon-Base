services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aureon
      POSTGRES_PASSWORD: aureon
      POSTGRES_DB: aureon
    ports:
      - "5432:5432"
    volumes:
      - aureon_pg:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aureon -d aureon"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  aureon_pg:
