name: Aureon Base CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aureon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aureon_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund --no-package-lock
      - name: Apply database schema and additive migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/aureon_ci
        run: npm run migrate
      - name: Run syntax, authentication and PostgreSQL isolation tests
        env:
          JWT_SECRET: ci-access-secret-32-characters-minimum-123456789
          JWT_REFRESH_SECRET: ci-refresh-secret-32-characters-minimum-123456
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/aureon_ci
        run: npm test

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for healthy production and run public smoke
        shell: bash
        run: |
          set -euo pipefail
          : > production-public-smoke.log
          for attempt in {1..24}; do
            if npm run smoke:production 2>&1 | tee production-public-smoke.log; then
              exit 0
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "production_smoke_failed_after_retries" | tee -a production-public-smoke.log
              exit 1
            fi
            sleep 10
          done
      - name: Run authenticated tenant isolation smoke when credentials exist
        shell: bash
        env:
          AUREON_E2E_A_TOKEN: ${{ secrets.AUREON_E2E_A_TOKEN }}
          AUREON_E2E_B_TOKEN: ${{ secrets.AUREON_E2E_B_TOKEN }}
          AUREON_E2E_A_PROJECT: ${{ secrets.AUREON_E2E_A_PROJECT }}
          AUREON_E2E_B_PROJECT: ${{ secrets.AUREON_E2E_B_PROJECT }}
        run: |
          set -euo pipefail
          : > production-auth-smoke.log

          configured=0
          for name in AUREON_E2E_A_TOKEN AUREON_E2E_B_TOKEN AUREON_E2E_A_PROJECT AUREON_E2E_B_PROJECT; do
            if [ -n "${!name:-}" ]; then
              configured=$((configured + 1))
            fi
          done

          if [ "$configured" -eq 0 ]; then
            echo "authenticated_production_smoke=SKIP reason=test_credentials_not_configured" | tee production-auth-smoke.log
            exit 0
          fi

          if [ "$configured" -ne 4 ]; then
            echo "authenticated_production_smoke=FAIL reason=partial_test_credentials configured=${configured}/4" | tee production-auth-smoke.log
            exit 1
          fi

          npm run smoke:production:auth 2>&1 | tee production-auth-smoke.log
      - name: Persist production validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-validation-evidence-${{ github.sha }}
          path: |
            production-public-smoke.log
            production-auth-smoke.log
          if-no-files-found: warn
          retention-days: 30
