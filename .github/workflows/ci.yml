name: Aureon Base CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run syntax and authentication regression tests
        env:
          JWT_SECRET: ci-access-secret-32-characters-minimum-123456789
          JWT_REFRESH_SECRET: ci-refresh-secret-32-characters-minimum-123456
        run: npm test
