name: Fix Aureon Console CSP

# One-time migration workflow; remove after successful patch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[console-csp-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install validated same-origin console runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/console.js')
          s=p.read_text()
          imp="import { runAureonConsole } from './consoleClient.js';\n\n"
          if not s.startswith(imp):
              s=imp+s
          marker='export function registerConsoleRoutes({ app }) {'
          if marker not in s:
              raise SystemExit('Console route block not found')
          prefix=s[:s.index(marker)]
          for legacy in ['const consoleScriptMatch = page.match(', 'const consolePage = page.replace(']:
              pos=prefix.find(legacy)
              if pos!=-1:
                  prefix=prefix[:pos]
                  break
          block="""const consolePage = page.replace(/<script>[\\s\\S]*?<\\/script>/, '<script src=\"/console/app.js\"></script>');

export function registerConsoleRoutes({ app }) {
  app.get('/', (_req, res) => res.type('html').send(consolePage));
  app.get('/console', (_req, res) => res.type('html').send(consolePage));
  app.get('/console/app.js', (_req, res) => res.type('application/javascript').send(`(${runAureonConsole.toString()})();`));
}
"""
          p.write_text(prefix.rstrip()+"\n\n"+block)
          PY
      - name: Validate
        run: |
          npm install
          node --check src/consoleClient.js
          npm run check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/console.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: serve validated Aureon Console runtime [console-csp-fixed]"
          git push
