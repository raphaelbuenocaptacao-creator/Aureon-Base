name: Fix Aureon Console CSP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[console-csp-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Move inline console script behind same-origin route
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/console.js')
          s=p.read_text()
          old="""export function registerConsoleRoutes({ app }) {
  app.get('/', (_req, res) => res.type('html').send(page));
  app.get('/console', (_req, res) => res.type('html').send(page));
}
"""
          new="""const consoleScriptMatch = page.match(/<script>([\\s\\S]*?)<\\/script>/);
const consoleScript = consoleScriptMatch?.[1] || '';
const consolePage = page.replace(/<script>[\\s\\S]*?<\\/script>/, '<script src=\"/console/app.js\"></script>');

export function registerConsoleRoutes({ app }) {
  app.get('/', (_req, res) => res.type('html').send(consolePage));
  app.get('/console', (_req, res) => res.type('html').send(consolePage));
  app.get('/console/app.js', (_req, res) => res.type('application/javascript').send(consoleScript));
}
"""
          if old not in s:
              raise SystemExit('Console route block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Validate
        run: |
          npm install
          npm run check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/console.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: serve Aureon Console JS with CSP-safe route [console-csp-fixed]"
          git push
