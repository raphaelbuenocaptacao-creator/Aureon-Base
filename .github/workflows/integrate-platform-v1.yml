name: Integrate Aureon Base V1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: "!contains(github.event.head_commit.message, '[platform-v1-integrated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize platform source
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p=Path('src/console.js')
          s=p.read_text()
          imp="import { runAureonConsole } from './consoleClient.js';\n\n"
          if not s.startswith(imp):
              s=imp+s
          marker='export function registerConsoleRoutes({ app }) {'
          if marker not in s:
              raise SystemExit('Console route block not found')
          prefix=s[:s.index(marker)]
          for legacy in ['const consoleScriptMatch = page.match(', 'const consolePage = page.replace(']:
              pos=prefix.find(legacy)
              if pos!=-1:
                  prefix=prefix[:pos]
                  break
          block="""const consolePage = page.replace(/<script>[\\s\\S]*?<\\/script>/, '<script src=\"/console/app.js\"></script>');

export function registerConsoleRoutes({ app }) {
  app.get('/', (_req, res) => res.type('html').send(consolePage));
  app.get('/console', (_req, res) => res.type('html').send(consolePage));
  app.get('/console/app.js', (_req, res) => res.type('application/javascript').send(`(${runAureonConsole.toString()})();`));
}
"""
          p.write_text(prefix.rstrip()+"\n\n"+block)

          pkg=Path('package.json')
          data=json.loads(pkg.read_text())
          data['version']='0.6.0'
          data['scripts']['check']='node --check src/server.js && node --check src/auth.js && node --check src/db.js && node --check src/migrate.js && node --check src/platformData.js && node --check src/platformAdmin.js && node --check src/console.js && node --check src/consoleClient.js && node --check sdk/aureon.js && node --check sdk/aureon-v1.js'
          pkg.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Validate
        run: |
          npm install
          npm run check
      - name: Commit permanent integration
        run: |
          if git diff --quiet; then
            echo "Already integrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/console.js package.json
          git commit -m "feat: finalize Aureon Base V1 console [platform-v1-integrated]"
          git push
