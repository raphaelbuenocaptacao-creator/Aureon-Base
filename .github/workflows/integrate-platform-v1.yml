name: Integrate Aureon Base V1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: "!contains(github.event.head_commit.message, '[platform-v1-integrated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate platform routes permanently
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/server.js')
          s = p.read_text()

          import_line = "import { registerPlatformDataRoutes } from './platformData.js';\n"
          anchor = "import { requireAuth, signAccessToken, signRefreshToken, verifyRefreshToken } from './auth.js';\n"
          if import_line not in s:
              s = s.replace(anchor, anchor + import_line)

          registration = """\nregisterPlatformDataRoutes({\n  app,\n  query,\n  requireAuth,\n  projectMembership,\n  subscriptionFor,\n  accessState,\n  audit,\n});\n\n"""
          not_found = "app.use((_req, res) => res.status(404).json({ error: 'not_found' }));"
          if registration.strip() not in s:
              s = s.replace(not_found, registration + not_found)

          s = s.replace("version: '0.5.0'", "version: '0.6.0'")
          s = s.replace("Aureon Base v0.5.0 listening", "Aureon Base v0.6.0 listening")
          p.write_text(s)

          pkg = Path('package.json')
          t = pkg.read_text()
          t = t.replace('"version": "0.2.1"', '"version": "0.6.0"')
          t = t.replace('node --check src/migrate.js && node --check sdk/aureon.js', 'node --check src/migrate.js && node --check src/platformData.js && node --check sdk/aureon.js && node --check sdk/aureon-v1.js')
          pkg.write_text(t)
          PY
      - name: Validate
        run: |
          npm install
          npm run check
      - name: Commit permanent integration
        run: |
          if git diff --quiet; then
            echo "Already integrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js package.json
          git commit -m "feat: integrate Aureon Base V1 Data API [platform-v1-integrated]"
          git push
