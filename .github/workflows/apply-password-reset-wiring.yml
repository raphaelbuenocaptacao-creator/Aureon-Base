name: Apply password reset wiring

on:
  push:
    branches: [feat/password-reset-wiring]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/password-reset-wiring
      - name: Apply reviewed patch
        run: |
          git apply --check .automation/password-reset-wiring.patch
          git apply .automation/password-reset-wiring.patch
          rm .automation/password-reset-wiring.patch
          rm .github/workflows/apply-password-reset-wiring.yml
          git diff --check
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "auth: wire one-time password reset tokens"
          git push origin HEAD:feat/password-reset-wiring
